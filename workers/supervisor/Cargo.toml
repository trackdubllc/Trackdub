[package]
name = "trackdub-supervisor"
version = "0.1.0"
edition = "2021"
description = "Supervises Trackdub inference workers ( starting with the Chatterbox Python worker ): process lifecycle, readiness gates, version-stamp refusal, crash backoff."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
