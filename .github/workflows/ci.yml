name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  format:
    name: Verify Code Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Restore Dependencies
        run: dotnet restore Trackdub.slnx -m:1

      - name: Verify Format Style Limits
        run: dotnet format Trackdub.slnx --verify-no-changes

  repository-boundary:
    name: Verify Repository Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Scan for stale license/desktop-boundary claims
        run: python3 scripts/ci/check-repository-boundary.py

  build:
    name: Build & Test (${{ matrix.name }})
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Restore Dependencies
        run: dotnet restore Trackdub.slnx -m:1

      - name: Compile
        run: dotnet build Trackdub.slnx -c Release --no-restore -m:1

      - name: Test
        run: dotnet test Trackdub.slnx -c Release --no-build -m:1
