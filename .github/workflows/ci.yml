name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # actions/setup-dotnet's install script defaults to a system-wide location
  # (e.g. C:\Program Files\dotnet) that self-hosted runner service accounts
  # often can't write to. Redirect installs into the per-job runner temp
  # directory, which is always writable regardless of runner OS or account.
  DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet

jobs:
  format:
    name: Verify Code Format
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Restore Dependencies
        shell: bash
        run: dotnet restore Trackdub.slnx -m:1

      - name: Verify Format Style Limits
        shell: bash
        run: dotnet format Trackdub.slnx --verify-no-changes

  repository-boundary:
    name: Verify Repository Boundary
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Scan for stale license/desktop-boundary claims
        shell: bash
        run: python3 scripts/ci/check-repository-boundary.py

  build:
    name: Build & Test (${{ matrix.name }})
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: [self-hosted, Windows]
          - name: Linux
            runner: [self-hosted, Linux]
          - name: macOS
            runner: [self-hosted, macOS]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Restore Dependencies
        shell: bash
        run: dotnet restore Trackdub.slnx -m:1

      - name: Compile
        shell: bash
        run: dotnet build Trackdub.slnx -c Release --no-restore -m:1

      - name: Test
        shell: bash
        run: dotnet test Trackdub.slnx -c Release --no-build -m:1
