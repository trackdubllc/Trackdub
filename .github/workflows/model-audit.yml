name: Model manifest audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize_ci:
    name: Optimize CI
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@402a89bc8aa6db18ae1f9c61953d001d5f9d828f # main
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}

  audit:
    name: Validate model manifest
    needs: optimize_ci
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit manifest
        shell: bash
        run: |
          python3 tools/ci/audit-bundled-model-manifest.py
          python3 tools/ci/validate-manifest-schema.py
          python3 tools/ci/verify-manifest-hashes.py --structural --all-audited

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [ -f audit-summary.md ]; then
            cat audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  verify-hf-hashes:
    name: Verify HF manifest hashes
    needs: optimize_ci
    if: needs.optimize_ci.outputs.skip == 'false' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Hugging Face hashes
        shell: bash
        run: python3 tools/ci/verify-manifest-hashes.py --verify-hf --all-audited
