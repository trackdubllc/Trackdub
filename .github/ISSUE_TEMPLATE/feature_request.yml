name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        # Feature Request

        Describe the feature you'd like to see in Trackdub.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should the feature do?
      placeholder: "Users should be able to..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature important? What problem does it solve?
      placeholder: "This would help because..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches could solve this problem?
      placeholder: "We could also..."

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria (Optional)
      description: How would you know this feature is complete?
      placeholder: |
        - [ ] Endpoint `/api/v2/...` returns X
        - [ ] CLI supports `--new-flag`
        - [ ] Tests cover...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and feature requests
          required: true
        - label: This feature aligns with Trackdub's scope (AI dubbing workstation)
          required: true
