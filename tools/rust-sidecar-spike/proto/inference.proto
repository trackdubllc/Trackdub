// SKETCH — graduation path if JSON-lines outgrows the spike.
// Not compiled, not referenced anywhere. Here so reviewers can judge whether
// the contract survives a move to gRPC without redesign.
syntax = "proto3";

package trackdub.sidecar.v1;

service InferenceSidecar {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Load(LoadRequest) returns (LoadResponse);
  rpc Infer(InferRequest) returns (InferResponse);
}

message HealthRequest {}

message HealthResponse {
  bool alive = 1;
  bool model_loaded = 2;
  // What the sidecar ACTUALLY settled on — surfaced in stage evidence.
  string active_provider = 3;
}

message LoadRequest {
  string model_path = 1;
  // Preference order; sidecar tries in order, reports the winner.
  repeated string providers = 2;
}

message LoadResponse {
  bool loaded = 1;
  string active_provider = 2;
  int64 load_ms = 3;
  string error = 4;
}

message InferRequest {
  string id = 1;
  // Tensor name -> raw little-endian bytes; dtypes/shapes in TensorMeta.
  map<string, bytes> inputs = 2;
  map<string, TensorMeta> meta = 3;
}

message TensorMeta {
  repeated int64 shape = 1;
  string dtype = 2; // e.g. "int64", "float32"
}

message InferResponse {
  string id = 1;
  bool ok = 2;
  map<string, bytes> outputs = 3;
  map<string, TensorMeta> meta = 4;
  int64 infer_ms = 5;
  string error = 6;
}
