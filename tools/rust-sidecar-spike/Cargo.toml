# Sketch only — not built, not referenced by any .slnx.
# If the pitch is accepted, pin real versions here.
[package]
name = "trackdub-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
# First-class ONNX Runtime bindings (ORT C API, no Python).
ort = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
